################################# Plugins ######################################

set -g @plugin 'roosta/tmux-fuzzback'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'NHDaly/tmux-better-mouse-mode'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

set -g @continuum-restore 'on'
set -g @continuum-boot 'off' # ghostty starts tmux itself
set -g @continuum-save-interval '10'

################################# Options ######################################

# Better colors
set -g default-terminal "$TERM"
set-option -sa terminal-features ',$TERM:RGB'
set-option -ga terminal-features ",$TERM:usstyle"
set -sg terminal-overrides ",$TERM:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

set -g base-index 1          # start indexing windows at 1 instead of 0
set -g pane-base-index 1     # same for panes
set-window-option -g pane-base-index 1
set -g detach-on-destroy off # don't exit from tmux when closing a session
set -g escape-time 0         # zero-out escape time delay
set -g history-limit 1000000 # increase history size (from 2,000)
set -g mouse on              # enable mouse support
set -g mode-keys vi          # vi keys in copy mode
set -g renumber-windows on   # renumber all windows when any window is closed
set -g set-clipboard on      # use system clipboard
set -g status-interval 1     # update the status bar every second
set -g allow-set-title on    # let programs set #{pane_title} (used for agent session names)

set-option -g default-shell "/bin/zsh" # login shell: loads .zprofile (brew shellenv)

############################ Status bar theming ################################

set -g status-position top       # macOS / darwin style
set -g status-style "bg=default" # transparent
set -g status-left "#[fg=blue,bold]#S "
set -ga status-left ' #[fg=white,nobold]#(gitmux -cfg $HOME/.config/tmux/gitmux.yml "#{pane_current_path}")'
set -g status-left-length 200    # increase length (from 10)
set -g status-right "#{?pane_in_mode,#[fg=yellow#,bold]COPY ,}" # copy mode indicator
# Agents waiting (💬) or done (✅) in other sessions
set -ga status-right '#[fg=yellow,nobold]#(~/.config/tmux/scripts/agents-attention #{q:session_name})'
set -g status-right-length 100
# Window name computed in the status line, not via automatic-rename-format: tmux only
# re-evaluates that on pane output, so a #() job there lags one program behind.
# Status jobs re-run as soon as their args change and redraw on completion.
# Manually renamed windows (automatic-rename off) keep their #W.
set -g @window-name '#(~/.config/tmux/scripts/window-name #{q:pane_current_command} #{window_panes} #{pane_pid} #{q:pane_title})'
# Agent status from workmux hooks (🤖 working, 💬 waiting, ✅ done)
set -g @agent-status '#{?@workmux_status, #{@workmux_status},}'
set -g window-status-current-format ' #[fg=magenta]#{?automatic-rename,#{E:@window-name},#W}#{E:@agent-status}'
set -g window-status-current-style default # no underline, colour is enough
set -g window-status-format ' #[fg=gray]#{?automatic-rename,#{E:@window-name},#W}#{E:@agent-status}'
set -Fg 'status-format[1]' '#{status-format[0]}'
set -g 'status-format[1]' ""
set -g status 2

############################### Color theming ##################################

set -g message-command-style bg=default,fg=yellow
set -g message-style bg=default,fg=yellow
set -g mode-style bg=default,fg=yellow
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
# Popups (sesh, workmux): transparent like the rest, instead of tmux 3.8's theme grey
set -g popup-style bg=default
set -g popup-border-style 'fg=magenta,bg=default'
set -g popup-border-lines rounded

################################ Keybindings ###################################

# Change prefix to ctrl+space (default: ctrl+b)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Visual mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Copy mode: prefix + Esc to enter ([ is awkward on AZERTY); Esc clears the selection, else quits
bind-key Escape copy-mode
bind-key -T copy-mode-vi Escape if-shell -F '#{selection_present}' 'send-keys -X clear-selection' 'send-keys -X cancel'

# vim-tmux-navigator takes C-h/j/k/l for panes; prefix + C-k sends the shell its C-k
# (prefix + C-l clear screen is provided by the plugin)
bind-key C-k send-keys C-k

# Search in buffer
bind-key / copy-mode \; send-key /

# Split in cwd
bind v split-window -v -c "#{pane_current_path}"
bind h split-window -h -c "#{pane_current_path}"

# New window at the session root (sesh sessions are created in their project dir);
# the "default" session started by ghostty has no project, so it stays in cwd
bind c new-window -c "#{?#{==:#S,default},#{pane_current_path},#{session_path}}"
# Same, but straight into Claude Code (replaces customize-mode); the window closes when claude exits
bind C new-window -c "#{?#{==:#S,default},#{pane_current_path},#{session_path}}" claude

# Synchronized panes
bind-key g set-window-option synchronize-panes\; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"

# Sesh menu (built-in picker, options in ~/.config/sesh/sesh.toml)
bind-key "T" display-popup -E -w 80% -h 70% "sesh picker"
# Previous session; unlike switch-client -l, still works after closing a session
bind-key L run-shell "sesh last"

# Agents (workmux): dashboard of every agent across sessions,
# and jump to the next one waiting for input or done
bind-key a display-popup -E -w 80% -h 70% "workmux dashboard"
bind-key A run-shell "workmux last-done"

# lazygit / lazydocker in the current pane's directory (D replaces choose-client)
bind-key G display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind-key D display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazydocker

################################# Load TPM #####################################

# Install missing plugins on first start (prefix + I to do it manually)
if "test ! -d ~/.config/tmux/plugins/tmux-sensible" \
  "run '/opt/homebrew/opt/tpm/share/tpm/bin/install_plugins'"
run '/opt/homebrew/opt/tpm/share/tpm/tpm'

# Must come after TPM: replaces the format set by tmux-nerd-font-window-name.
# Plain #W for choose-tree/sesh/resurrect; the status bar shows @window-name
# (icon + agent session title for claude, opencode, pi).
set -g automatic-rename on
set -g automatic-rename-format '#{pane_current_command}'
